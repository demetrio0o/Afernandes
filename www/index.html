<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Orçamentos</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash"><img src="logo.png" alt=""></div>

<header class="topbar">
  <div class="brand"><img src="logo.png" alt=""><span id="page-title">Materiais</span></div>
  <div class="top-actions">
    <button class="icon-btn" id="btn-config" title="Configurações" aria-label="Configurações">⚙</button>
    <button class="icon-btn" id="btn-theme" title="Modo claro/escuro" aria-label="Alternar tema">◐</button>
  </div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="materiais" class="active"><span>📦</span>Materiais</button>
  <button data-tab="novo"><span>📝</span>Cliente</button>
  <button data-tab="clientes"><span>📁</span>Salvos</button>
</nav>

<div id="toast"></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>

<script src="lib/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
